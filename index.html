<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SIRISNO Edu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col justify-between">

  <!-- NAVBAR -->
  <nav class="bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center sticky top-0 z-40 shadow-sm">
    <div class="flex items-center gap-3 cursor-pointer" onclick="navigate('home')">
      <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md">S</div>
      <span class="text-2xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-teal-500">SIRISNO Edu</span>
    </div>
    <div class="flex items-center gap-3">
      <button id="lofiBtn" onclick="toggleLofi()" class="p-2.5 rounded-full bg-slate-100 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 transition flex items-center gap-2 text-sm font-semibold">
        🎵 <span class="hidden sm:inline">Muzik Lofi</span>
      </button>
      <div id="authNav">
        <button onclick="navigate('student_dash')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm shadow-md transition">Masuk Murid</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main id="app" class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 fade-in"></main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs sm:text-sm">
    <p>&copy; 2026 SIRISNO Edu. Pembelajaran Digital Interaktif KPM.</p>
  </footer>

  <script>
    // --- APP STATE ---
    let state = {
      view: 'home',
      role: null,
      playerName: 'Murid Pintar',
      subject: null,
      level: null,
      gameMode: null,
      noteData: null,
      score: 0,
      lives: 3,
      currentQ: 0,
      lofiPlaying: false
    };

    const SUBJECTS = ['Bahasa Melayu', 'Sains', 'Matematik', 'Sejarah', 'Pendidikan Islam', 'Bahasa Arab', 'PJPK', 'Muzik', 'RBT', 'PSV'];

    const SAMPLE_NOTES = {
      'Sains': {
        title: 'Fotosintesis & Tenaga Tumbuhan',
        intro: 'Fotosintesis ialah proses tumbuhan hijau membuat makanan sendiri menggunakan cahaya matahari, air, dan karbon dioksida.',
        points: [
          { subtitle: 'Klorofil', description: 'Pigmen hijau daun yang menyerap tenaga cahaya matahari.' },
          { subtitle: 'Karbon Dioksida', description: 'Gas yang diserap dari udara melalui liang stoma.' },
          { subtitle: 'Air & Mineral', description: 'Diserap oleh akar dari tanah untuk kegunaan daun.' },
          { subtitle: 'Glukosa', description: 'Hasil makanan yang memberi tenaga kepada tumbuhan.' },
          { subtitle: 'Gas Oksigen', description: 'Dibebaskan untuk kegunaan manusia dan haiwan bernafas.' }
        ],
        fun_fact: 'Tanpa fotosintesis, bekalan oksigen di Bumi akan berkurangan dengan cepat!'
      },
      'Bahasa Melayu': {
        title: 'Kata Kerja & Imbuhan',
        intro: 'Kata kerja menunjukkan perbuatan atau tindakan yang dilakukan oleh manusia, haiwan, atau benda.',
        points: [
          { subtitle: 'Kata Kerja Transitif', description: 'Memerlukan objek terus (Contoh: membaca buku).' },
          { subtitle: 'Kata Kerja Tak Transitif', description: 'Boleh berdiri sendiri (Contoh: tidur, tersenyum).' },
          { subtitle: 'Imbuhan Men-', description: 'Membentuk kata kerja aktif seperti menulis dan melukis.' },
          { subtitle: 'Imbuhan Di-', description: 'Membentuk kata kerja pasif seperti ditulis dan dimakan.' }
        ],
        fun_fact: 'Bahasa Melayu mempunyai sistem imbuhan yang sangat kaya dan fleksibel!'
      }
    };

    const SAMPLE_GAMES = {
      mcq: [
        { q: 'Apakah yang diserap oleh akar tumbuhan semasa fotosintesis?', options: ['Air', 'Oksigen', 'Minyak'], correct: 0, trivia: 'Air diangkut dari akar ke daun melalui salur xilem!' },
        { q: 'Nilai tempat bagi angka 5 dalam 45,210 ialah?', options: ['Ratus', 'Ribu', 'Puluh Ribu'], correct: 1, trivia: 'Angka 5 berada di kedudukan ribu!' },
        { q: 'Antara berikut, yang manakah Kata Kerja Transitif?', options: ['Membaca buku', 'Tidur nyenyak', 'Tersenyum'], correct: 0, trivia: 'Membaca buku memerlukan objek (buku).' }
      ],
      whack: [
        { q: 'Ketuk gas yang dibebaskan semasa fotosintesis:', options: ['Oksigen', 'Karbon Dioksida', 'Nitrogen'], correct: 0, trivia: 'Oksigen dibebaskan untuk kita bernafas!' },
        { q: 'Ketuk jawapan bagi 12 × 4:', options: ['48', '44', '52'], correct: 0, trivia: '12 darab 4 ialah 48!' }
      ],
      riddle: [
        { riddle: 'Saya hijau di pokok, menyerap matahari untuk buat makanan. Siapa saya?', answer: 'DAUN', trivia: 'Daun mempunyai klorofil hijau.' },
        { riddle: 'Saya tempat tinggal manusia dan haiwan. Siapa saya?', answer: 'BUMI', trivia: 'Bumi ialah planet ketiga dari matahari.' }
      ]
    };

    // --- LOFI AUDIO ENGINE ---
    let audioCtx = null;
    let lofiInterval = null;
    function toggleLofi() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      state.lofiPlaying = !state.lofiPlaying;
      const btn = document.getElementById('lofiBtn');
      if (state.lofiPlaying) {
        audioCtx.resume();
        btn.className = "p-2.5 rounded-full bg-indigo-600 text-white transition flex items-center gap-2 text-sm font-semibold shadow-md animate-pulse";
        btn.innerHTML = "🎶 <span>Muzik Lofi: ON</span>";
      } else {
        audioCtx.suspend();
        btn.className = "p-2.5 rounded-full bg-slate-100 text-slate-600 hover:bg-indigo-50 transition flex items-center gap-2 text-sm font-semibold";
        btn.innerHTML = "🎵 <span class=\"hidden sm:inline\">Muzik Lofi</span>";
      }
    }

    function playSound(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'correct') {
          osc.frequency.setValueAtTime(523, now);
          osc.frequency.setValueAtTime(659, now + 0.1);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.3);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0, now + 0.3);
        }
        osc.start(now);
        osc.stop(now + 0.3);
      } catch(e) {}
    }

    // --- ROUTER & RENDER ENGINE ---
    function navigate(viewName) {
      state.view = viewName;
      render();
      window.scrollTo(0,0);
    }

    function render() {
      const app = document.getElementById('app');
      app.innerHTML = '';

      if (state.view === 'home') {
        app.innerHTML = `
          <div class="text-center py-12 space-y-6">
            <h1 class="text-4xl sm:text-6xl font-black text-slate-900 leading-tight">
              Pendidikan Interaktif & Menyeronokkan dengan <br><span class="text-blue-600">SIRISNO Edu</span>
            </h1>
            <p class="text-lg text-slate-600 max-w-2xl mx-auto">
              Platform digital berasaskan silibus KPM (Tahun 1-6). Dilengkapi nota interaktif & 3 mod permainan AI merangsang minda.
            </p>
            <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
              <button onclick="navigate('student_dash')" class="bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold py-4 px-8 rounded-2xl shadow-xl transition transform hover:scale-105">
                🚀 Masuk Sebagai Murid
              </button>
              <button onclick="navigate('teacher_dash')" class="bg-white hover:bg-slate-100 border-2 border-slate-200 text-slate-800 text-lg font-bold py-4 px-8 rounded-2xl shadow-sm transition">
                👨‍🏫 Portal Guru
              </button>
            </div>
            <div class="grid sm:grid-cols-3 gap-6 pt-12 text-left">
              <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="text-3xl mb-3">📚</div>
                <h3 class="font-bold text-xl mb-2">Nota & Infografik</h3>
                <p class="text-slate-600 text-sm">Nota ringkas dan padat untuk ulangan pantas subjek KPM.</p>
              </div>
              <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="text-3xl mb-3">🎮</div>
                <h3 class="font-bold text-xl mb-2">Permainan Digital AI</h3>
                <p class="text-slate-600 text-sm">3 Mod Permainan Interaktif (Pengembaraan, Ketuk Jawapan & Teka-Teki).</p>
              </div>
              <div class="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm">
                <div class="text-3xl mb-3">📊</div>
                <h3 class="font-bold text-xl mb-2">Analisis Prestasi</h3>
                <p class="text-slate-600 text-sm">Pantau tahap penguasaan murid secara terus.</p>
              </div>
            </div>
          </div>
        `;
      } 
      
      else if (state.view === 'student_dash') {
        app.innerHTML = `
          <div class="space-y-8">
            <div>
              <h2 class="text-3xl font-extrabold">Selamat Datang, Murid Pintar! 🚀</h2>
              <p class="text-slate-500 mt-1">Pilih aktiviti pembelajaran anda hari ini.</p>
            </div>
            <div class="grid md:grid-cols-2 gap-6">
              <div onclick="navigate('notes_subject')" class="bg-indigo-600 text-white p-8 rounded-3xl shadow-xl cursor-pointer hover:scale-105 transition">
                <div class="text-4xl mb-4">📖</div>
                <h3 class="text-2xl font-bold mb-2">Nota & Infografik</h3>
                <p class="text-indigo-100">Ulang kaji subjek teras & elektif KPM dengan visual menarik.</p>
              </div>
              <div onclick="navigate('game_name')" class="bg-pink-600 text-white p-8 rounded-3xl shadow-xl cursor-pointer hover:scale-105 transition">
                <div class="text-4xl mb-4">🎮</div>
                <h3 class="text-2xl font-bold mb-2">Permainan Digital AI</h3>
                <p class="text-pink-100">Cabaran minda 3 Mod Pintar (Pengembaraan, Ketuk Jawapan & Teka-Teki).</p>
              </div>
            </div>
          </div>
        `;
      }

      else if (state.view === 'teacher_dash') {
        app.innerHTML = `
          <div class="bg-white p-8 rounded-3xl border border-slate-100 shadow-sm text-center space-y-4 max-w-2xl mx-auto">
            <div class="text-5xl">👨‍🏫</div>
            <h2 class="text-3xl font-bold">Portal Guru SIRISNO Edu</h2>
            <p class="text-slate-600">Sistem pengurusan kuiz dan pangkalan data murid sedang disedia untuk kemaskini seterusnya.</p>
            <button onclick="navigate('student_dash')" class="bg-slate-900 text-white font-bold px-6 py-3 rounded-xl">Kembali ke Dashboard</button>
          </div>
        `;
      }

      else if (state.view === 'notes_subject') {
        let html = `
          <div class="space-y-6">
            <button onclick="navigate('student_dash')" class="text-slate-500 font-bold">← Kembali</button>
            <h2 class="text-3xl font-bold">Pilih Subjek Nota:</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        `;
        SUBJECTS.forEach(sub => {
          html += `
            <div onclick="selectSubjectNotes('${sub}')" class="bg-white p-6 rounded-2xl border border-slate-200 hover:border-indigo-500 hover:shadow-lg transition cursor-pointer text-center font-bold text-slate-800">
              <div class="text-3xl mb-2">📄</div>
              ${sub}
            </div>
          `;
        });
        html += `</div></div>`;
        app.innerHTML = html;
      }

      else if (state.view === 'notes_view') {
        const note = SAMPLE_NOTES[state.subject] || SAMPLE_NOTES['Sains'];
        let html = `
          <div class="bg-white rounded-3xl overflow-hidden shadow-xl border border-slate-100 p-6 sm:p-10 space-y-8">
            <button onclick="navigate('notes_subject')" class="text-slate-500 font-bold mb-4">← Pilih Subjek Lain</button>
            <div class="bg-indigo-600 text-white p-8 rounded-2xl">
              <span class="bg-indigo-500 text-xs font-bold px-3 py-1 rounded-full uppercase">${state.subject}</span>
              <h1 class="text-3xl sm:text-5xl font-extrabold mt-3">${note.title}</h1>
            </div>
            <p class="text-xl text-slate-600 italic border-l-4 border-indigo-500 pl-4">"${note.intro}"</p>
            <div class="grid sm:grid-cols-2 gap-4">
        `;
        note.points.forEach((pt, idx) => {
          html += `
            <div class="bg-indigo-50 p-5 rounded-2xl border border-indigo-100">
              <span class="w-8 h-8 bg-indigo-600 text-white rounded-full inline-flex items-center justify-center font-bold mb-3">${idx+1}</span>
              <h3 class="font-bold text-lg mb-1">${pt.subtitle}</h3>
              <p class="text-slate-600 text-sm">${pt.description}</p>
            </div>
          `;
        });
        html += `
            </div>
            <div class="bg-amber-400 text-slate-900 p-6 rounded-2xl font-bold flex items-center gap-4">
              <div class="text-3xl">💡</div>
              <div>Fakta Menarik: ${note.fun_fact}</div>
            </div>
          </div>
        `;
        app.innerHTML = html;
      }

      else if (state.view === 'game_name') {
        app.innerHTML = `
          <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md mx-auto text-center space-y-6">
            <div class="text-5xl">🎮</div>
            <h2 class="text-2xl font-bold">Masukkan Nama Pemain</h2>
            <input id="pNameInput" type="text" value="${state.playerName}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-center font-bold text-lg" />
            <button onclick="setPlayerName()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-4 rounded-xl shadow-lg">Seterusnya</button>
          </div>
        `;
      }

      else if (state.view === 'game_mode') {
        app.innerHTML = `
          <div class="space-y-6">
            <button onclick="navigate('student_dash')" class="text-slate-500 font-bold">← Kembali</button>
            <h2 class="text-3xl font-bold text-center">Pilih Mod Permainan</h2>
            <div class="grid md:grid-cols-3 gap-6">
              <div onclick="startGame('mcq')" class="bg-blue-600 text-white p-8 rounded-3xl cursor-pointer hover:scale-105 transition shadow-xl text-center">
                <div class="text-5xl mb-4">🚀</div>
                <h3 class="text-2xl font-bold mb-2">Pengembaraan Fakta</h3>
                <p class="text-blue-100 text-sm">Jawab cabaran fakta secepat mungkin.</p>
              </div>
              <div onclick="startGame('whack')" class="bg-emerald-600 text-white p-8 rounded-3xl cursor-pointer hover:scale-105 transition shadow-xl text-center">
                <div class="text-5xl mb-4">🔨</div>
                <h3 class="text-2xl font-bold mb-2">Ketuk Jawapan Pintar</h3>
                <p class="text-emerald-100 text-sm">Ketuk jawapan tepat yang muncul dari lubang!</p>
              </div>
              <div onclick="startGame('riddle')" class="bg-orange-500 text-white p-8 rounded-3xl cursor-pointer hover:scale-105 transition shadow-xl text-center">
                <div class="text-5xl mb-4">🧩</div>
                <h3 class="text-2xl font-bold mb-2">Teka-Teki Pintar</h3>
                <p class="text-orange-100 text-sm">Main teka huruf rahsia!</p>
              </div>
            </div>
          </div>
        `;
      }

      else if (state.view === 'game_play') {
        const questions = SAMPLE_GAMES[state.gameMode] || SAMPLE_GAMES.mcq;
        const q = questions[state.currentQ];

        if (!q || state.lives <= 0) {
          app.innerHTML = `
            <div class="bg-slate-900 text-white p-10 rounded-3xl max-w-md mx-auto text-center space-y-6 shadow-2xl">
              <div class="text-6xl">🏆</div>
              <h2 class="text-3xl font-extrabold">Permainan Tamat!</h2>
              <p class="text-slate-400">Pemain: ${state.playerName}</p>
              <div class="text-5xl font-black text-yellow-400">${state.score} Mata</div>
              <button onclick="navigate('game_mode')" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-4 rounded-xl shadow-lg">Main Semula</button>
            </div>
          `;
          return;
        }

        let gameContent = '';
        if (state.gameMode === 'mcq') {
          gameContent = `
            <div class="space-y-4">
              <div class="bg-slate-800 p-6 rounded-2xl text-center"><h3 class="text-2xl font-bold">${q.q}</h3></div>
              <div class="grid sm:grid-cols-3 gap-4">
                ${q.options.map((opt, i) => `<button onclick="answerMCQ(${i})" class="p-4 bg-slate-800 hover:bg-indigo-600 rounded-xl font-bold text-lg">${opt}</button>`).join('')}
              </div>
            </div>
          `;
        } else if (state.gameMode === 'whack') {
          gameContent = `
            <div class="space-y-6">
              <div class="bg-slate-800 p-6 rounded-2xl text-center"><h3 class="text-2xl font-bold">${q.q}</h3></div>
              <div class="grid grid-cols-3 gap-4 max-w-md mx-auto">
                ${q.options.map((opt, i) => `
                  <div class="h-28 bg-slate-950 rounded-2xl border-4 border-slate-800 flex items-end justify-center p-1 overflow-hidden">
                    <button onclick="answerMCQ(${i})" class="w-full h-full bg-emerald-500 hover:bg-emerald-400 text-white font-bold rounded-xl p-2 text-sm">${opt}</button>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        } else if (state.gameMode === 'riddle') {
          gameContent = `
            <div class="space-y-6 text-center">
              <div class="bg-slate-800 p-6 rounded-2xl"><h3 class="text-2xl font-bold text-orange-400 italic">"${q.riddle}"</h3></div>
              <div class="text-3xl font-black tracking-widest bg-slate-800 p-4 rounded-xl inline-block text-orange-400">${q.answer}</div>
              <div class="pt-4"><button onclick="answerMCQ(0)" class="bg-orange-500 hover:bg-orange-400 text-white font-bold px-8 py-3 rounded-xl">Saya Faham Jawapan!</button></div>
            </div>
          `;
        }

        app.innerHTML = `
          <div class="bg-slate-900 text-white p-6 rounded-3xl shadow-2xl border-4 border-slate-700 space-y-6 max-w-4xl mx-auto">
            <div class="flex justify-between items-center text-sm sm:text-base font-bold">
              <span class="text-indigo-400">Soalan ${state.currentQ + 1}/${questions.length}</span>
              <div class="flex gap-4">
                <span class="text-yellow-400">Skor: ${state.score}</span>
                <span class="text-red-400">Nyawa: ${'❤️'.repeat(state.lives)}</span>
              </div>
            </div>
            ${gameContent}
          </div>
        `;
      }
    }

    // --- ACTIONS ---
    function selectSubjectNotes(sub) {
      state.subject = sub;
      navigate('notes_view');
    }

    function setPlayerName() {
      const val = document.getElementById('pNameInput').value;
      if (val.trim()) state.playerName = val;
      navigate('game_mode');
    }

    function startGame(mode) {
      state.gameMode = mode;
      state.score = 0;
      state.lives = 3;
      state.currentQ = 0;
      navigate('game_play');
    }

    function answerMCQ(index) {
      const questions = SAMPLE_GAMES[state.gameMode] || SAMPLE_GAMES.mcq;
      const q = questions[state.currentQ];
      if (index === q.correct || state.gameMode === 'riddle') {
        playSound('correct');
        state.score += 20;
      } else {
        playSound('wrong');
        state.lives -= 1;
      }
      state.currentQ += 1;
      render();
    }

    // INITIAL RENDER
    render();
  </script>
</body>
</html>
```
