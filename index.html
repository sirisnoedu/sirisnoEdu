    // --- LOFI MUSIC GENERATOR (Web Audio API) ---
    class LofiGenerator {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.masterGain = null;
        this.nextNoteTime = 0;
        this.currentChord = 0;
        this.timerID = null;
        
        this.chords = [
          [130.81, 164.81, 196.00, 246.94, 293.66], // Cmaj9
          [174.61, 220.00, 261.63, 329.63, 392.00], // Fmaj9
          [196.00, 246.94, 293.66, 329.63, 392.00], // G6
          [110.00, 130.81, 164.81, 196.00, 246.94]  // Am9
        ];
      }

      initContext() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.15;
          this.masterGain.connect(this.ctx.destination);
        }
      }

      playChord(chordIndex, time) {
        const chord = this.chords[chordIndex];
        chord.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = i === 0 ? 'triangle' : 'sine';
          osc.frequency.value = freq;
          
          gain.gain.setValueAtTime(0, time);
          gain.gain.linearRampToValueAtTime(0.15, time + 0.5 + (i * 0.1));
          gain.gain.exponentialRampToValueAtTime(0.001, time + 4.0);
          
          osc.connect(gain);
          gain.connect(this.masterGain);
          
          osc.start(time);
          osc.stop(time + 4.5);
        });

        if (Math.random() > 0.3) {
            const sparkleOsc = this.ctx.createOscillator();
            const sparkleGain = this.ctx.createGain();
            sparkleOsc.type = 'sine';
            sparkleOsc.frequency.value = chord[Math.floor(Math.random() * chord.length)] * (Math.random() > 0.5 ? 2 : 4); 
            sparkleGain.gain.setValueAtTime(0, time + 1.0); 
            sparkleGain.gain.linearRampToValueAtTime(0.05, time + 1.5);
            sparkleGain.gain.exponentialRampToValueAtTime(0.001, time + 3.0);
            sparkleOsc.connect(sparkleGain);
            sparkleGain.connect(this.masterGain);
            sparkleOsc.start(time + 1.0);
            sparkleOsc.stop(time + 3.0);
        }
      }

      scheduler() {
        while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
          this.playChord(this.currentChord, this.nextNoteTime);
          this.nextNoteTime += 4.0;
          this.currentChord = (this.currentChord + 1) % this.chords.length;
        }
        this.timerID = requestAnimationFrame(this.scheduler.bind(this));
      }

      toggle() {
        this.initContext();
        if (this.isPlaying) {
          cancelAnimationFrame(this.timerID);
          this.ctx.suspend();
          this.isPlaying = false;
        } else {
          this.ctx.resume();
          this.nextNoteTime = this.ctx.currentTime + 0.1;
          this.scheduler();
          this.isPlaying = true;
        }
        return this.isPlaying;
      }
    }

    // --- SFX GENERATOR ---
    const playSFX = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'hit' || type === 'correct') {
           osc.type = 'sine';
           osc.frequency.setValueAtTime(600, now);
           osc.frequency.setValueAtTime(1200, now + 0.1);
           gain.gain.setValueAtTime(0.3, now);
           gain.gain.linearRampToValueAtTime(0, now + 0.3);
           osc.start(now);
           osc.stop(now + 0.3);
        } else if (type === 'wrong') {
           osc.type = 'sawtooth';
           osc.frequency.setValueAtTime(250, now);
           osc.frequency.linearRampToValueAtTime(100, now + 0.3);
           gain.gain.setValueAtTime(0.3, now);
           gain.gain.linearRampToValueAtTime(0, now + 0.3);
           osc.start(now);
           osc.stop(now + 0.3);
        } else if (type === 'over') {
           osc.type = 'square';
           osc.frequency.setValueAtTime(150, now);
           osc.frequency.exponentialRampToValueAtTime(50, now + 1.0);
           gain.gain.setValueAtTime(0.3, now);
           gain.gain.linearRampToValueAtTime(0, now + 1.0);
           osc.start(now);
           osc.stop(now + 1.0);
        }
      } catch(e) {}
    };

    // --- ARCADE BGM GENERATOR ---
    class ArcadeBGM {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
        this.masterGain = null;
        this.nextNoteTime = 0;
        this.currentNote = 0;
        this.timerID = null;
        
        this.notes = [
          [261.63, 329.63, 392.00, 523.25], // C maj
          [261.63, 329.63, 392.00, 523.25], 
          [174.61, 220.00, 261.63, 349.23], // F maj
          [196.00, 246.94, 293.66, 392.00]  // G maj
        ];
        this.chordIndex = 0;
      }

      initContext() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = 0.03;
          this.masterGain.connect(this.ctx.destination);
        }
      }

      scheduler() {
        while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          
          osc.type = 'square';
          osc.frequency.value = this.notes[this.chordIndex][this.currentNote];
          
          gain.gain.setValueAtTime(0, this.nextNoteTime);
          gain.gain.linearRampToValueAtTime(0.1, this.nextNoteTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, this.nextNoteTime + 0.15);
          
          osc.connect(gain);
          gain.connect(this.masterGain);
          osc.start(this.nextNoteTime);
          osc.stop(this.nextNoteTime + 0.15);

          this.currentNote++;
          if (this.currentNote >= 4) {
              this.currentNote = 0;
              if (Math.random() > 0.7) {
                  this.chordIndex = (this.chordIndex + 1) % this.notes.length;
              }
          }
          this.nextNoteTime += 0.15; 
        }
        this.timerID = requestAnimationFrame(this.scheduler.bind(this));
      }

      start() {
        this.initContext();
        if (!this.isPlaying) {
          this.ctx.resume();
          this.nextNoteTime = this.ctx.currentTime + 0.1;
          this.scheduler();
          this.isPlaying = true;
        }
      }

      stop() {
        if (this.isPlaying && this.ctx) {
          cancelAnimationFrame(this.timerID);
          this.ctx.suspend();
          this.isPlaying = false;
        }
      }
    }

    // --- ACTIVE GAME ENGINE (MCQ, WHACK, RIDDLE) ---
    function ActiveGameEngine({ subject, level, gameMode, playerName, goBack, t }) {
      const [currentQ, setCurrentQ] = useState(0);
      const [score, setScore] = useState(0);
      const [lives, setLives] = useState(3);
      const [feedback, setFeedback] = useState(null);
      const [gameOver, setGameOver] = useState(false);

      // Riddles State
      const [guessedLetters, setGuessedLetters] = useState([]);
      const [riddleMistakes, setRiddleMistakes] = useState(0);

      // Whack State
      const [activeMoles, setActiveMoles] = useState([]);

      const questions = SAMPLE_GAMES[gameMode] || SAMPLE_GAMES.mcq;
      const q = questions[currentQ];

      // Whack Mole Loop
      useEffect(() => {
        if (gameMode === 'whack' && !feedback && !gameOver) {
          const interval = setInterval(() => {
            const currentItem = questions[currentQ];
            if (!currentItem) return;
            const options = currentItem.options.map((opt, i) => ({ text: opt, isCorrect: i === currentItem.correct, originalIndex: i }));
            options.sort(() => Math.random() - 0.5);
            const holes = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5).slice(0, 3);
            const newMoles = holes.map((holeId, idx) => ({ holeId, ...options[idx] }));
            setActiveMoles(newMoles);
          }, 2000);
          return () => clearInterval(interval);
        }
      }, [gameMode, currentQ, feedback, gameOver]);

      const handleAnswer = (index) => {
        if (feedback || gameOver) return;
        if (index === q.correct) {
          playSFX('correct');
          setScore(score + 20);
          setFeedback({ isCorrect: true, text: `${t.congrats} ${q.trivia}` });
        } else {
          playSFX('wrong');
          const newLives = lives - 1;
          setLives(newLives);
          setFeedback({ isCorrect: false, text: `${t.oops} ${q.trivia}` });
        }
      };

      const handleLetterGuess = (letter) => {
        if (feedback || gameOver || guessedLetters.includes(letter)) return;
        const word = (q.answer_word || "").toUpperCase();
        const newGuessed = [...guessedLetters, letter];
        setGuessedLetters(newGuessed);

        if (!word.includes(letter)) {
          playSFX('wrong');
          const newMistakes = riddleMistakes + 1;
          setRiddleMistakes(newMistakes);
          if (newMistakes >= 5) {
            const newLives = lives - 1;
            setLives(newLives);
            setFeedback({ isCorrect: false, text: `${t.oops} Jawapan: ${word}. ${q.trivia}` });
          }
        } else {
          playSFX('correct');
          const isWin = word.split('').every(char => newGuessed.includes(char));
          if (isWin) {
            setScore(score + 30);
            setFeedback({ isCorrect: true, text: `${t.congrats} ${q.trivia}` });
          }
        }
      };

      const handleNext = () => {
        setFeedback(null);
        setActiveMoles([]);
        setGuessedLetters([]);
        setRiddleMistakes(0);

        if (lives <= 0 || currentQ >= questions.length - 1) {
          playSFX('over');
          setGameOver(true);
        } else {
          setCurrentQ(currentQ + 1);
        }
      };

      if (gameOver) {
        return (
          <div className="p-6 max-w-md mx-auto text-center bg-slate-900 text-white rounded-3xl my-10 p-10 shadow-2xl animate-in zoom-in">
            <div className="text-6xl mb-4">🏆</div>
            <h2 className="text-3xl font-extrabold mb-2">Permainan Tamat!</h2>
            <p className="text-slate-400 mb-6">Pemain: {playerName}</p>
            <div className="text-5xl font-black text-yellow-400 mb-8">{score} <span className="text-lg text-slate-300">Mata</span></div>
            <button 
              onClick={goBack}
              className="w-full bg-pink-600 hover:bg-pink-500 text-white font-bold py-4 rounded-xl shadow-lg transition"
            >
              Main Semula
            </button>
          </div>
        );
      }

      return (
        <div className="p-4 sm:p-6 max-w-4xl mx-auto w-full animate-in zoom-in-95">
          <button onClick={goBack} className="text-slate-500 hover:text-slate-800 mb-6 flex items-center gap-2 font-medium">
            ← {t.back}
          </button>

          <div className="bg-slate-900 rounded-3xl p-6 text-white shadow-2xl relative border-4 border-slate-700">
            <div className="flex justify-between items-center mb-6">
              <span className="text-indigo-400 font-bold">{subject} • Soalan {currentQ + 1}/{questions.length}</span>
              <div className="flex gap-4">
                <span className="text-yellow-400 font-bold">Skor: {score}</span>
                <span className="text-red-400 font-bold">Nyawa: {'❤️'.repeat(lives)}</span>
              </div>
            </div>

            {/* MCQ MODE */}
            {gameMode === 'mcq' && (
              <div className="space-y-6">
                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                  <h3 className="text-2xl font-bold text-center">{q.q}</h3>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  {q.options.map((opt, i) => (
                    <button 
                      key={i} 
                      onClick={() => handleAnswer(i)}
                      className="p-4 bg-slate-800 hover:bg-indigo-600 border border-slate-700 rounded-xl font-bold transition text-lg"
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* WHACK MODE */}
            {gameMode === 'whack' && (
              <div className="space-y-6">
                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center">
                  <h3 className="text-2xl font-bold">{q.q}</h3>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 max-w-xl mx-auto">
                  {[0, 1, 2, 3, 4, 5].map(holeId => {
                    const mole = activeMoles.find(m => m.holeId === holeId);
                    return (
                      <div key={holeId} className="h-32 bg-slate-950 rounded-2xl border-4 border-slate-800 flex items-end justify-center overflow-hidden p-1">
                        {mole && (
                          <button 
                            onClick={() => handleAnswer(mole.originalIndex)}
                            className="w-full h-full bg-emerald-500 hover:bg-emerald-400 text-white font-extrabold rounded-xl p-2 text-sm sm:text-base transition animate-in slide-in-from-bottom"
                          >
                            {mole.text}
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* RIDDLE MODE */}
            {gameMode === 'riddle' && (
              <div className="space-y-6 text-center">
                <div className="bg-slate-800 p-6 rounded-2xl border border-slate-700">
                  <h3 className="text-2xl font-bold text-orange-400 italic">"{q.riddle}"</h3>
                </div>
                
                <div className="flex justify-center gap-2">
                  {(q.answer_word || "").split('').map((char, i) => (
                    <div key={i} className="w-12 h-14 bg-slate-800 border-2 border-orange-500 rounded-lg flex items-center justify-center text-2xl font-black">
                      {guessedLetters.includes(char) ? char : '_'}
                    </div>
                  ))}
                </div>

                <div className="flex flex-wrap justify-center gap-2 max-w-lg mx-auto pt-4">
                  {"ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').map(letter => (
                    <button 
                      key={letter}
                      onClick={() => handleLetterGuess(letter)}
                      disabled={guessedLetters.includes(letter)}
                      className={`w-10 h-10 rounded-lg font-bold ${guessedLetters.includes(letter) ? 'bg-slate-800 text-slate-600' : 'bg-slate-700 hover:bg-white hover:text-slate-900 text-white'}`}
                    >
                      {letter}
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* FEEDBACK MODAL */}
            {feedback && (
              <div className="absolute inset-0 bg-slate-950/90 rounded-3xl flex items-center justify-center p-6 z-20">
                <div className="bg-slate-800 p-8 rounded-2xl border border-slate-600 text-center max-w-sm w-full">
                  <h3 className={`text-3xl font-extrabold mb-4 ${feedback.isCorrect ? 'text-green-400' : 'text-red-400'}`}>
                    {feedback.isCorrect ? t.congrats : t.oops}
                  </h3>
                  <p className="text-slate-300 mb-6">{feedback.text}</p>
                  <button 
                    onClick={handleNext}
                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition"
                  >
                    {t.next_challenge}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
